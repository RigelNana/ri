schema: ri.conformance/v1

baseline:
  repository: ref/pi
  commit: 518855dd502220d0c6480fb8863e2e7f8799893f
  package_version: 0.82.0
  expected_test_files: 343
  authority: [source, tests, protocol-docs, examples, readme]

test_inventory:
  roots:
    - ref/pi/packages/ai
    - ref/pi/packages/agent
    - ref/pi/packages/coding-agent
    - ref/pi/packages/tui
    - ref/pi/packages/storage/sqlite-node
    - ref/pi/scripts
  globs: ["**/*.test.ts", "**/*.test.mjs"]
  output: conformance/reference-tests.json
  require_every_test_mapped: true
  ownership:
    - { glob: "packages/ai/**", prefix: "ai." }
    - { glob: "packages/agent/src/harness/**", prefix: "harness." }
    - { glob: "packages/agent/**", prefix: "agent." }
    - { glob: "packages/storage/sqlite-node/**", prefix: "session.sqlite." }
    - { glob: "packages/coding-agent/test/tools/**", prefix: "tools." }
    - { glob: "packages/coding-agent/test/extensions/**", prefix: "extensions." }
    - { glob: "packages/coding-agent/test/rpc/**", prefix: "rpc." }
    - { glob: "packages/coding-agent/**", prefix: "harness." }
    - { glob: "packages/tui/**", prefix: "tui." }
    - { glob: "scripts/**", prefix: "cli." }

canonical_json:
  encoding: utf-8
  line_ending: lf
  trailing_newline: false
  unicode: nfc
  object_keys: lexical
  arrays: preserve
  numbers:
    finite: shortest-roundtrip
    negative_zero: 0
    non_finite: reject
  timestamps:
    action: replace
    value: "<timestamp>"
  identifiers:
    action: map-by-first-observation
    prefix: id
  paths:
    separators: slash
    drive_letter: lowercase
    workspace: "<workspace>"
    home: "<home>"
    temp: "<temp>"
  headers:
    names: lowercase
    redact: [authorization, api-key, x-api-key, proxy-authorization, cookie, set-cookie]
  volatile_fields: [duration, durationMs, elapsed, requestId, traceId]
  usage:
    absent_optional_fields: omit
    cost_precision: 12

gates:
  transform: { kind: deterministic, network: false }
  agent: { kind: scripted, network: false }
  wire: { kind: local-protocol, network: loopback }
  session_rpc: { kind: durable-protocol, network: false }
  live: { kind: credential-gated, network: true }

statuses:
  allowed: [specified, implemented, passing, live-gated, blocked, out-of-scope]
  passing_requires: [rust_test, reference, gate]

runners:
  rust: ["cargo", "run", "-p", "ri-conformance", "--", "run"]
  reference: ["node", "conformance/reference/run.mjs"]
  fixture_dir: conformance/fixtures
  snapshot_dir: conformance/snapshots

# Each row is an externally observable contract. `rust_test` is a stable test target,
# not an assertion that implementation already exists.
